name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test, lint and package
        run: >-
          bash ./gradlew --no-daemon --stacktrace --continue
          :dyltun:testDebugUnitTest
          :dyltun:lintDebug
          :dyltun:assembleDebugAndroidTest
          :dyltun:publishReleasePublicationToMavenLocal
          :sample:lintDebug
          :sample:assembleDebug

      - name: Upload build reports and packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dyltun-build-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            dyltun/build/reports/
            sample/build/reports/
            dyltun/build/outputs/aar/
            dyltun/build/outputs/apk/androidTest/
            dyltun/build/intermediates/source_jar/release/*sources.jar
            dyltun/build/publications/release/
            sample/build/outputs/apk/debug/
